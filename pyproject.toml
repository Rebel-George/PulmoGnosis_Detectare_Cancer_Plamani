[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulmognosis"
version = "0.1.0"
description = "Virtual biopsy for NSCLC: tumour localisation and histology / EGFR / KRAS prediction from CT and PET."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
